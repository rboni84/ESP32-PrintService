; PrintService - servidor de monitoramento de impressoras (ESP32-C6)
; Fase 1: portal AP (captive portal) para configuracao basica.

[platformio]
; Diretorios curtos para evitar erro de caminho longo do Windows (MAX_PATH=260)
; ao extrair as libs do ESP32-C6 (esp_matter). Alternativa: habilitar
; LongPathsEnabled=1 em HKLM\SYSTEM\CurrentControlSet\Control\FileSystem (admin).
packages_dir = C:\pio\packages
cache_dir = C:\pio\cache

; Fixado em 55.03.311: a "stable" (55.03.312+) exige PlatformIO Core >= 6.2.0.
; ATENCAO: rode "pio run" pelo PowerShell/CMD, nunca pelo Git Bash: o instalador
; de toolchain (idf_tools.py) aborta com "MSys/Mingw is not supported" quando a
; variavel MSYSTEM existe, deixando toolchain-riscv32-esp e tool-esptoolpy
; incompletos em C:\pio\packages (apague-os antes de tentar de novo).
[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
; Placa com 4 MB: particao de app de 3 MB (sem OTA), sem SPIFFS. O app padrao (1,25 MB) nao cabe a fase 2.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"0.3.5\"
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; DevKitM-1: LED RGB WS2812 no GPIO8, botao BOOT no GPIO9 (ativo em nivel baixo)
    -DPIN_STATUS_LED=8
    -DPIN_RESET_BTN=9

lib_deps =
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.4.1
